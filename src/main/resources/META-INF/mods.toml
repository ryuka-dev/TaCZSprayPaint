modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/ryuka-dev/TaCZSprayPaint/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "https://github.com/ryuka-dev/TaCZSprayPaint"
logoFile = "logo.png"
# pixel art: scale the logo without smoothing
logoBlur = false
description = '''
Spray paint for Timeless and Classics Zero guns. A spray can gives the gun in your off hand a random finish:
pattern, grade and wear are rolled every time. Paint remover takes it off again.
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tacz"
mandatory = true
versionRange = "${tacz_version_range}"
ordering = "AFTER"
side = "BOTH"
